name: Publish release

on:
  push:
    branches: [main]
    paths:
      - "flybit/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Flybit version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("flybit/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("Flybit __version__ not found")
          print(match.group(1))
          PY
          )

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.exists.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXTRA=()
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            EXTRA+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Flybit $TAG" \
            --generate-notes \
            "${EXTRA[@]}"

      - name: Reuse existing release
        if: steps.exists.outputs.exists == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "$TAG already exists; executable asset will be rebuilt and replaced."

  build-windows-release:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" "pyinstaller>=6.11,<7" "pillow>=10,<12"

      - name: Compile and neural unit tests
        shell: pwsh
        run: |
          python -m compileall -q flybrain flybit tests
          python -m unittest discover -s tests -v
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from flybit.ui import FlyOverlay, FoodOverlay, FoodPlacementOverlay, ControlPanel; app=QApplication([]); fly=FlyOverlay(); food=FoodOverlay(); placement=FoodPlacementOverlay(); panel=ControlPanel(); panel.update_care(hunger=.5, feedings=1, last_feed=None, food_active=False); panel.feed_button.click(); print('Qt desktop shell + care OK')"

      - name: Generate Windows icon
        shell: pwsh
        run: python scripts/make_icon.py

      - name: Build Flybit.exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm Flybit.spec

      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path dist/Flybit/* -DestinationPath Flybit-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flybit-Windows-x64-${{ needs.publish.outputs.version }}
          path: Flybit-Windows-x64.zip
          if-no-files-found: error

      - name: Attach executable to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$env:TAG" Flybit-Windows-x64.zip --clobber


  build-android-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable Android APK
        shell: bash
        run: |
          gradle -p android clean assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk Flybit-Android.apk

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flybit-Android-${{ needs.publish.outputs.version }}
          path: Flybit-Android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release upload "$TAG" Flybit-Android.apk --clobber
