name: MaleCNS neural validation

on:
  pull_request:
    branches: [main]
    paths:
      - "flybrain/**"
      - "flybit/neural.py"
      - "flybit/motion.py"
      - "flybit/world.py"
      - "flybit/sensory.py"
      - "flybit/arousal.py"
      - "flybit/circadian.py"
      - "flybit/olfaction.py"
      - "flybit/vision.py"
      - "flybit/ui.py"
      - "flybit/state.py"
      - "scripts/validate_graded_vision.py"
      - "scripts/validate_motor_groups.py"
      - "scripts/validate_ethogram.py"
      - "tests/**"
      - ".github/workflows/neural-validation.yml"
  workflow_dispatch:

jobs:
  validate-graded-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache MaleCNS prebuilt data
        uses: actions/cache@v4
        with:
          path: ~/fly-data
          key: male-cns-brain-v1

      - name: Install neural runtime
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Compile Python sources
        run: python -m compileall -q flybit flybrain scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate real MaleCNS graded relay
        run: python scripts/validate_graded_vision.py

      - name: Validate real MaleCNS motor decoder
        run: python scripts/validate_motor_groups.py

      - name: Validate Flybit ethogram calibration
        run: python scripts/validate_ethogram.py
