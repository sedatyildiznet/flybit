name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" "pyinstaller>=6.11,<7" "pillow>=10,<12"

      - name: Compile and neural unit tests
        shell: pwsh
        run: |
          python -m compileall -q flybrain flybit tests
          python -m unittest discover -s tests -v
          python -c "import flybrain, flybit; print('Flybit', flybit.__version__)"
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from flybit.ui import FlyOverlay, FoodOverlay, ControlPanel; app=QApplication([]); fly=FlyOverlay(); food=FoodOverlay(); panel=ControlPanel(); panel.update_care(hunger=.5, feedings=1, last_feed=None, food_active=False); print('Qt desktop shell + care OK')"

      - name: Generate Windows icon
        shell: pwsh
        run: python scripts/make_icon.py

      - name: Build Flybit.exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm Flybit.spec

      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path dist/Flybit/* -DestinationPath Flybit-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flybit-Windows-x64
          path: Flybit-Windows-x64.zip
          if-no-files-found: error

      - name: Attach executable to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Flybit-Windows-x64.zip --clobber
