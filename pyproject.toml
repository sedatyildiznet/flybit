[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain"
version = "0.6.0"
description = "MaleCNS connectome neural core with the Flybit desktop organism."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "alextitonis" }]
keywords = ["connectome", "drosophila", "neuroscience", "desktop organism"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13"]
build = ["pandas>=2.2", "pyarrow>=15"]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
flybrain = "flybrain.__main__:main"
flybit = "flybit.__main__:main"

[project.urls]
Source = "https://github.com/sedatyildiznet/flybit"
Upstream = "https://github.com/alextitonis/fly.ai"

[tool.setuptools]
packages = ["flybrain", "flybit"]
